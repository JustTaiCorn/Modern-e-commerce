name: Build and Deploy Release

on:
  push:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space for Docker Build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: make release

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release

      - name: Copy deployment files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deployment/release/release-docker-compose.yaml,deployment/release/start-app.sh,.env"
          target: "/home/${{ secrets.EC2_USER }}/ecommerce"
          overwrite: true

      - name: Update version and deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            # Cập nhật VERSION mới vào .env trên EC2 trong khi giữ nguyên DB credentials
            if [ -f /home/${{ secrets.EC2_USER }}/ecommerce/.env ]; then
              NEW_VERSION=$(grep '^VERSION=' /home/${{ secrets.EC2_USER }}/ecommerce/.env | cut -d '=' -f2)
              NEW_REGISTRY=$(grep '^REGISTRY=' /home/${{ secrets.EC2_USER }}/ecommerce/.env | cut -d '=' -f2)
              cd /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release
              if [ -n "$NEW_VERSION" ]; then
                sed -i "s|^VERSION=.*|VERSION=$NEW_VERSION|" .env
              fi
              if [ -n "$NEW_REGISTRY" ]; then
                sed -i "s|^REGISTRY=.*|REGISTRY=$NEW_REGISTRY|" .env
              fi
              rm -f /home/${{ secrets.EC2_USER }}/ecommerce/.env
            fi

            # Thực thi deploy
            cd /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release
            chmod +x start-app.sh
            ./start-app.sh

      - name: Health check after deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sleep 10
            curl -f http://localhost/v1/health || (echo "❌ Health check FAILED" && exit 1)
            echo "✅ Health check passed successfully!"
