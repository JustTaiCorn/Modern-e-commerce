name: Build and Deploy Release

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # ==========================================================
  # CI: Chạy khi có PR vào main hoặc push trực tiếp vào main
  # ==========================================================
  ci:
    name: Continuous Integration (Lint, Test, Build)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @ecommerce/server prisma generate
        env:
          DATABASE_URL: "postgresql://dummy:dummy@localhost:5432/ecommerce?schema=public"

      - name: Run Linter
        run: pnpm lint

      - name: Run Tests
        run: pnpm test

      - name: Build Packages
        run: pnpm build

  # ==========================================================
  # CD: Chỉ chạy khi push vào main (hoặc dispatch) VÀ sau khi CI pass
  # ==========================================================
  build-and-deploy:
    name: Continuous Deployment (EC2 Release)
    needs: ci
    if: (github.event_name == 'push' && github.ref == 'refs/heads/main') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Free Disk Space for Docker Build
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          df -h

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push images
        env:
          DOCKER_HUB_USERNAME: ${{ secrets.DOCKER_HUB_USERNAME }}
          DOCKER_HUB_ACCESS_TOKEN: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}
        run: make release

      - name: Ensure deploy directory exists
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            mkdir -p /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release

      - name: Copy deployment files via SCP
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          source: "deployment/release/release-docker-compose.yaml,deployment/release/start-app.sh,.env"
          target: "/home/${{ secrets.EC2_USER }}/ecommerce"
          overwrite: true

      - name: Update version and deploy application
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            # Cập nhật VERSION mới vào .env trên EC2 trong khi giữ nguyên DB credentials
            if [ -f /home/${{ secrets.EC2_USER }}/ecommerce/.env ]; then
              NEW_VERSION=$(grep '^VERSION=' /home/${{ secrets.EC2_USER }}/ecommerce/.env | cut -d '=' -f2)
              NEW_REGISTRY=$(grep '^REGISTRY=' /home/${{ secrets.EC2_USER }}/ecommerce/.env | cut -d '=' -f2)
              cd /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release
              if [ -n "$NEW_VERSION" ]; then
                sed -i "s|^VERSION=.*|VERSION=$NEW_VERSION|" .env
              fi
              if [ -n "$NEW_REGISTRY" ]; then
                sed -i "s|^REGISTRY=.*|REGISTRY=$NEW_REGISTRY|" .env
              fi
              rm -f /home/${{ secrets.EC2_USER }}/ecommerce/.env
            fi

            # Thực thi deploy
            cd /home/${{ secrets.EC2_USER }}/ecommerce/deployment/release
            chmod +x start-app.sh
            ./start-app.sh

      - name: Health check after deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: ${{ secrets.EC2_PORT }}
          script: |
            sleep 10
            curl -f http://localhost/v1/health || (echo " Health check FAILED" && exit 1)
            echo "Health check passed successfully!"
